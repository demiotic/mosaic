[workspace]
members = [
    "crates/mosaic-core",
    # Future crates:
    # "crates/mosaic-py",
    # "crates/mosaic-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mosaic Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/mosaic"

[workspace.dependencies]
# Arrow and Parquet
arrow = "53.3.0"
parquet = "53.3.0"

# AWS S3
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.59"

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto (for SHA256 hashing)
sha2 = "0.10"
hex = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation (ULID for time-ordered IDs)
ulid = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
